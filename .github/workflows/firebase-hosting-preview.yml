# Builds every pull request and deploys it to a temporary Firebase Hosting
# preview channel. The preview link is posted as a comment on the pull request.
# The live site is not touched.
#
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT_CREASECRAFT_23140,
# created once by running `firebase init hosting:github` in CreaseCraft/.
name: Deploy preview (pull request)

on:
  pull_request:
    paths:
      - 'CreaseCraft/**'
      - '.github/workflows/firebase-hosting-*.yml'

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    # Secrets are not available to pull requests from forks.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CreaseCraft
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CreaseCraft/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CREASECRAFT_23140 }}
          projectId: creasecraft-23140
          entryPoint: CreaseCraft
          expires: 7d
