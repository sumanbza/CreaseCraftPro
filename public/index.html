    const IconShieldAlert = () => (

    const IconCheckCircle = () => (

    );

    const IconUser = () => (
      <svg className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" />
      </svg>
    );

    function App() {
      // Auth & User Profile State
      const [authUser, setAuthUser] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [authMode, setAuthMode] = useState('SIGNIN'); // 'SIGNIN' | 'SIGNUP'
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [showClubOnboardingModal, setShowClubOnboardingModal] = useState(false);
      const [onboardingTab, setOnboardingTab] = useState('CREATE'); // 'CREATE' | 'JOIN'

      // Form State for Auth & Club Onboarding
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [fullName, setFullName] = useState('');
      const [discipline, setDiscipline] = useState('Fast Bowler');
      const [bowlingArm, setBowlingArm] = useState('Right-Arm Fast');
      
      const [newClubName, setNewClubName] = useState('');
      const [newClubCode, setNewClubCode] = useState('');
      const [joinClubCode, setJoinClubCode] = useState('');
      const [joinRole, setJoinRole] = useState('Player');

      // Application Data State with LocalStorage Persistence
      const [clubs, setClubs] = useState(() => JSON.parse(localStorage.getItem('cc_clubs')) || INITIAL_CLUBS);
      const [memberships, setMemberships] = useState(() => JSON.parse(localStorage.getItem('cc_memberships')) || INITIAL_MEMBERSHIPS);
      const [globalLogs, setGlobalLogs] = useState(() => JSON.parse(localStorage.getItem('cc_global_logs')) || INITIAL_GLOBAL_LOGS);
      const [zonePlans, setZonePlans] = useState(() => JSON.parse(localStorage.getItem('cc_zone_plans')) || INITIAL_MULTI_ZONE_PLANS);
      const [personalPlans, setPersonalPlans] = useState(() => JSON.parse(localStorage.getItem('cc_personal_plans')) || []);
      const [drills, setDrills] = useState(DRILLS_LIBRARY);

      // Workspace Context State
      const [activeClubId, setActiveClubId] = useState('club-melbourne');
      const [activeRole, setActiveRole] = useState('Player');
      const [activeSquadId, setActiveSquadId] = useState('squad-1st-xi');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [notification, setNotification] = useState(null);
      const [showWorkspaceDropdown, setShowWorkspaceDropdown] = useState(false);

      // Session Verification State
      const [completionTarget, setCompletionTarget] = useState(null);
      const [actualBalls, setActualBalls] = useState(36);
      const [actualRPE, setActualRPE] = useState(7);
      const [actualSoreness, setActualSoreness] = useState(2);

      const triggerNotify = (msg, type = 'info') => {
        setNotification({ msg, type });
        setTimeout(() => setNotification(null), 3500);
      };

      // Modal State for Plan Editing
      const [showCreatePlanModal, setShowCreatePlanModal] = useState(false);
      const [editingPlanId, setEditingPlanId] = useState(null);
      const [newPlanTitle, setNewPlanTitle] = useState('');
      const [newPlanDate, setNewPlanDate] = useState('2026-07-28');
      const [newPlanTime, setNewPlanTime] = useState('6:00 PM - 7:30 PM');
      
      // Personal Planner Form State
      const [personalPlanBalls, setPersonalPlanBalls] = useState(36);
      const [personalPlanRPE, setPersonalPlanRPE] = useState(7);
      const [personalPlanNotes, setPersonalPlanNotes] = useState('Focus on delivery rhythm and target execution');
      const [personalActivities, setPersonalActivities] = useState(['', '', '', '', '']);

      // Zone Allocator Form State (Zone 1, 2, 3)
      const [newNetLanes, setNewNetLanes] = useState([
        { id: 'lane-1', name: 'Lane 1: High Pace Match Sim', batters: 'Steve Smith, Marnus Labuschagne', bowlersText: 'Pat Cummins (36b), Mitchell Starc (48b)' },
        { id: 'lane-2', name: 'Lane 2: Technical Spin & Flight', batters: 'Travis Head, Alex Carey', bowlersText: 'Nathan Lyon (42b), Adam Zampa (36b)' }
      ]);
      const [newCenterWicket, setNewCenterWicket] = useState('T20 Death Overs Match Sim');
      const [newCenterWicketParticipants, setNewCenterWicketParticipants] = useState('1st XI Squad');
      const [newFieldingStation, setNewFieldingStation] = useState('High-Ball & Boundary Relay Catching');
      const [newFieldingParticipants, setNewFieldingParticipants] = useState('Reserve Fast Bowlers');

      const getDeterministicUid = (userEmail) => {
        if (!userEmail) return 'user-starc';
        const clean = userEmail.toLowerCase().trim().replace(/[^a-z0-9]/g, '');
        return `user-${clean || 'player'}`;
      };

      const currentHuman = useMemo(() => {
        if (userProfile) return userProfile;
        return { uid: 'user-starc', name: 'Mitchell Starc', email: 'm.starc@cricket.au', discipline: 'Fast Bowler', bowlingArm: 'Left-Arm Fast' };
      }, [userProfile]);

      const clubRosterList = useMemo(() => {
        const defaultRoster = [
          { id: 'user-starc', name: 'Mitchell Starc', role: 'Fast Bowler' },
          { id: 'user-cummins', name: 'Pat Cummins', role: 'Fast Bowler' },
          { id: 'user-smith', name: 'Steve Smith', role: 'Batter' },
          { id: 'user-labuschagne', name: 'Marnus Labuschagne', role: 'Batter' },
          { id: 'user-head', name: 'Travis Head', role: 'All-Rounder' },
          { id: 'user-carey', name: 'Alex Carey', role: 'Wicket-Keeper' },
          { id: 'user-lyon', name: 'Nathan Lyon', role: 'Spin Bowler' },
          { id: 'user-zampa', name: 'Adam Zampa', role: 'Spin Bowler' }
        ];

        const activeMembers = memberships.filter(m => m.clubId === activeClubId);
        const activeUserNames = activeMembers.map(m => {
          if (m.userId === currentHuman.uid) return { id: m.userId, name: currentHuman.name, role: currentHuman.discipline || 'Player' };
          const found = defaultRoster.find(d => d.id === m.userId);
          if (found) return found;
          const formattedName = m.userId.replace('user-', '').replace('gmailcom', '').split('@')[0].split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
          return { id: m.userId, name: formattedName, role: m.roles?.[0] || 'Player' };
        });

        const combined = [...activeUserNames];
        defaultRoster.forEach(d => {
          if (!combined.some(c => c.name.toLowerCase() === d.name.toLowerCase())) {
            combined.push(d);
          }
        });
        return combined;
      }, [memberships, activeClubId, currentHuman]);

      const handleCreateClub = (e) => {
        e.preventDefault();
        if (!newClubName.trim() || !newClubCode.trim()) return;
        
        const clubId = `club-${Date.now()}`;
        const codeUpper = newClubCode.trim().toUpperCase();

        const newClubObj = {
          id: clubId,
          name: newClubName.trim(),
          code: codeUpper,
          customRoles: ['Bowling Specialist', 'S&C Coach'],
          squads: [
            { id: `squad-1-${Date.now()}`, name: '1st XI Senior' },
            { id: `squad-2-${Date.now()}`, name: '2nd XI Reserves' }
          ]
        };

        const newMembership = {
          id: `m-${Date.now()}`,
          userId: currentHuman.uid,
          clubId: clubId,
          roles: ['Club Admin', 'Head Coach'],
          squadIds: [newClubObj.squads[0].id]
        };

        setClubs(prev => [...prev, newClubObj]);
        setMemberships(prev => [...prev, newMembership]);
        setActiveClubId(clubId);
        setActiveRole('Head Coach');
        setActiveSquadId(newClubObj.squads[0].id);
        setActiveTab('matrix');
        setShowClubOnboardingModal(false);
        setNewClubName('');
        setNewClubCode('');
        triggerNotify(`Created club "${newClubObj.name}"! You are assigned as Head Coach / Admin.`, "success");
      };

      const handleJoinClub = (e) => {
        e.preventDefault();
        if (!joinClubCode.trim()) return;
        
        const targetCode = joinClubCode.trim().toUpperCase();
        const foundClub = clubs.find(c => c.code.toUpperCase() === targetCode);
        
        if (!foundClub) {
          triggerNotify(`No club found with code "${targetCode}". Check code and try again.`, "info");
          return;
        }

        const existing = memberships.find(m => m.userId === currentHuman.uid && m.clubId === foundClub.id);
        if (existing) {
          setActiveClubId(foundClub.id);
          setActiveRole(existing.roles?.[0] || 'Player');
          setShowClubOnboardingModal(false);
          triggerNotify(`Switched to workspace: ${foundClub.name}`, "info");
          return;
        }

        const newMembership = {
          id: `m-${Date.now()}`,
          userId: currentHuman.uid,
          clubId: foundClub.id,
          roles: [joinRole || 'Player'],
          squadIds: [foundClub.squads?.[0]?.id || '']
        };

        setMemberships(prev => [...prev, newMembership]);
        setActiveClubId(foundClub.id);
        setActiveRole(joinRole || 'Player');
        setActiveSquadId(foundClub.squads?.[0]?.id || '');
        const isCoach = ['Head Coach', 'Coach', 'Bowling Coach', 'Batting Coach', 'Club Admin'].some(r => joinRole.includes(r));
        setActiveTab(isCoach ? 'matrix' : 'dashboard');
        setShowClubOnboardingModal(false);
        setJoinClubCode('');
        triggerNotify(`Successfully joined ${foundClub.name}!`, "success");
      };

      const handleOpenCreateZonePlanModal = (planToEdit = null) => {
        if (planToEdit) {
          setEditingPlanId(planToEdit.id);
          setNewPlanTitle(planToEdit.title || '');
          setNewPlanDate(planToEdit.date || '2026-07-28');
          setNewPlanTime(planToEdit.timeSlots?.[0]?.time || '6:00 PM - 7:30 PM');
          setNewNetLanes(
            planToEdit.timeSlots?.[0]?.netLanes && planToEdit.timeSlots[0].netLanes.length > 0
              ? planToEdit.timeSlots[0].netLanes.map(l => ({
                  id: l.id || `lane-${Date.now()}-${Math.random()}`,
                  name: l.name || 'Lane 1: High Pace',
                  batters: typeof l.batters === 'string' ? l.batters : (Array.isArray(l.batters) ? l.batters.join(', ') : ''),
                  bowlersText: typeof l.bowlersText === 'string' ? l.bowlersText : (Array.isArray(l.bowlers) ? l.bowlers.map(b => typeof b === 'object' ? `${b.userId || 'Bowler'} (${b.balls || 36}b)` : b).join(', ') : '')
                }))
              : [
                  { id: 'lane-1', name: 'Lane 1: High Pace Match Sim', batters: 'Steve Smith, Marnus Labuschagne', bowlersText: 'Pat Cummins (36b), Mitchell Starc (48b)' },
                  { id: 'lane-2', name: 'Lane 2: Spin & Flight Control', batters: 'Travis Head, Alex Carey', bowlersText: 'Nathan Lyon (42b), Adam Zampa (36b)' }
                ]
          );
          setNewCenterWicket(planToEdit.timeSlots?.[0]?.centerWicket?.title || 'T20 Death Overs Match Sim');
          setNewCenterWicketParticipants(planToEdit.timeSlots?.[0]?.centerWicket?.participants || '1st XI Squad');
          setNewFieldingStation(planToEdit.timeSlots?.[0]?.fieldingStation?.title || 'High-Ball & Boundary Relay Catching');
          setNewFieldingParticipants(planToEdit.timeSlots?.[0]?.fieldingStation?.participants || 'Reserve Fast Bowlers');
        } else {
          setEditingPlanId(null);
          setNewPlanTitle('Tuesday Night Main Squad Microcycle');
          setNewPlanDate('2026-07-28');
          setNewPlanTime('6:00 PM - 7:30 PM');
          setNewNetLanes([
            { id: 'lane-1', name: 'Lane 1: High Pace Match Sim', batters: 'Steve Smith, Marnus Labuschagne', bowlersText: 'Pat Cummins (36b), Mitchell Starc (48b)' },
            { id: 'lane-2', name: 'Lane 2: Spin & Flight Control', batters: 'Travis Head, Alex Carey', bowlersText: 'Nathan Lyon (42b), Adam Zampa (36b)' }
          ]);
          setNewCenterWicket('T20 Death Overs Match Sim');
          setNewCenterWicketParticipants('1st XI Squad');
          setNewFieldingStation('High-Ball & Boundary Relay Catching');
          setNewFieldingParticipants('Reserve Fast Bowlers');
        }
        setShowCreatePlanModal(true);
      };

      const handleOpenPersonalPlanModal = (planToEdit = null) => {
        if (planToEdit) {
          setEditingPlanId(planToEdit.id);
          setNewPlanTitle(planToEdit.title || '');
          setNewPlanDate(planToEdit.date || '2026-07-28');
          setNewPlanTime(planToEdit.time || '4:00 PM - 5:30 PM');
          setPersonalPlanBalls(planToEdit.balls || 36);
          setPersonalPlanRPE(planToEdit.rpe || 7);
          setPersonalPlanNotes(planToEdit.notes || '');
          setPersonalActivities(
            planToEdit.activities && planToEdit.activities.length === 5 
              ? planToEdit.activities 
              : [...(planToEdit.activities || []), '', '', '', '', ''].slice(0, 5)
          );
        } else {
          setEditingPlanId(null);
          setNewPlanTitle('Private Throwdowns & Run-up Rhythm');
          setNewPlanDate('2026-07-28');
          setNewPlanTime('4:00 PM - 5:30 PM');
          setPersonalPlanBalls(36);
          setPersonalPlanRPE(7);
          setPersonalPlanNotes('Solo run-up rhythm and target yorker execution');
          setPersonalActivities([
            'Shoulder & Lower Back Dynamic Warmup',
            'Solo Run-Up Rhythm Drills (6 reps)',
            'Target Yorker Spot Bowling (18 deliveries)',
            'Good Length Outswing Execution (18 deliveries)',
            'Cool-down & Rotator Cuff Mobility Band Exercises'
          ]);
        }
        setShowCreatePlanModal(true);
      };

      const handleSaveZonePlan = (e) => {
        e.preventDefault();
        const updatedTimeSlots = [
          {
            id: 'slot-1',
            time: newPlanTime || '6:00 PM - 7:30 PM',
            netLanes: newNetLanes,
            centerWicket: { title: newCenterWicket || 'T20 Match Scenario', participants: newCenterWicketParticipants || 'Squad' },
            fieldingStation: { title: newFieldingStation || 'Catching Drills', participants: newFieldingParticipants || 'Reserves' }
          }
        ];

        if (editingPlanId) {
          setZonePlans(prev => prev.map(p => p.id === editingPlanId ? {
            ...p,
            title: newPlanTitle || 'Training Night Microcycle',
            date: newPlanDate,
            timeSlots: updatedTimeSlots
          } : p));
          triggerNotify("Updated multi-zone training plan! ✓", "success");
        } else {
          const newPlan = {
            id: `plan-zone-${Date.now()}`,
            clubId: activeClubId,
            squadId: activeSquadId || 'squad-1st-xi',
            date: newPlanDate,
            title: newPlanTitle || 'Training Night Microcycle',
            timeSlots: updatedTimeSlots
          };
          setZonePlans(prev => [newPlan, ...prev]);
          triggerNotify(`Published multi-zone plan: "${newPlan.title}"! ✓`, "success");
        }
        setShowCreatePlanModal(false);
        setEditingPlanId(null);
      };

      const handleSavePersonalPlan = (e) => {
        e.preventDefault();
        if (editingPlanId) {
          setPersonalPlans(prev => prev.map(p => p.id === editingPlanId ? {
            ...p,
            title: newPlanTitle || 'Private Session',
            date: newPlanDate,
            time: newPlanTime,

      useEffect(() => {

      const computeUserACWR = (userId) => {

        const processed = userLogs.map(s => {

          return { ...s, diffDays, workloadUnits: (s.balls || 0) * (s.rpe || 1) };
        });

        const acuteLogs = processed.filter(s => s.diffDays < 7);
        const acuteWorkload = acuteLogs.reduce((sum, s) => sum + s.workloadUnits, 0);
        const acuteBalls = acuteLogs.reduce((sum, s) => sum + s.balls, 0);

        const chronicLogs = processed.filter(s => s.diffDays < 28);
        const chronicSum = chronicLogs.reduce((sum, s) => sum + s.workloadUnits, 0);

        const isSpin = currentHuman.discipline.toLowerCase().includes('spin');
        const defaultChronicFloor = isSpin ? 300 : 180;
        const chronicWorkload = chronicLogs.length > 0 ? Math.max(defaultChronicFloor, chronicSum / 4) : defaultChronicFloor;

        const ratio = parseFloat((acuteWorkload / chronicWorkload).toFixed(2));
        const latestSoreness = userLogs.length > 0 ? [...userLogs].sort((a,b) => new Date(b.date) - new Date(a.date))[0].soreness : 0;
        const spikeLimit = isSpin ? 2.2 : 1.5;

        let status = "Safe";
        let color = "text-emerald-400";
        let bg = "bg-emerald-500/10";
        let border = "border-emerald-500/30";

        if (ratio < 0.8) {

          color = "text-amber-400";
          bg = "bg-amber-500/10";
          border = "border-amber-500/30";
        } else if (ratio > spikeLimit) {
          status = "CRITICAL SPIKE";
          color = "text-rose-500";
          bg = "bg-rose-500/10";
          border = "border-rose-500/30";

        return { acuteWorkload, chronicWorkload, ratio, acuteBalls, latestSoreness, status, color, bg, border, isSpin, spikeLimit };

                          <circle cx="88" cy="88" r="70" stroke="#1e293b" strokeWidth="12" fill="none" />
                          <circle

                            strokeWidth="12" fill="none" strokeDasharray={440}

                            strokeLinecap="round" className="transition-all duration-1000"
                          />
                        </svg>
                        <div className="text-center z-10">
                          <span className="text-3xl font-black text-white">{computeUserACWR(currentHuman.uid).ratio}</span>

                        </div>
                      </div>

                      <span className={`px-3 py-1 rounded-full text-xs font-bold border ${computeUserACWR(currentHuman.uid).color} ${computeUserACWR(currentHuman.uid).bg} ${computeUserACWR(currentHuman.uid).border}`}>

                    <div className="grid grid-cols-2 gap-2 text-center text-xs pt-3 border-t border-slate-800">

                  )}

                  <button
                    type="submit"
                    className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs py-3 rounded-xl transition-all shadow mt-2"
                  >
                    {authMode === 'SIGNIN' ? 'Sign In ✓' : 'Create Account & Continue ✓'}
                  </button>
                </form>

                <div className="text-center pt-2 border-t border-slate-800">
                  <button
                    onClick={() => setAuthMode(authMode === 'SIGNIN' ? 'SIGNUP' : 'SIGNIN')}
                    className="text-xs text-emerald-400 font-bold hover:underline"
                  >
                    {authMode === 'SIGNIN' ? "Don't have an account? Sign Up" : "Already registered? Sign In"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3: CLUB ONBOARDING MODAL (CREATE OR JOIN CLUB) */}
          {showClubOnboardingModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
                
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-extrabold text-base text-white flex items-center gap-2">
                    🏏 Club Onboarding Wizard
                  </h3>
                  <button onClick={() => setShowClubOnboardingModal(false)} className="text-slate-400 hover:text-white font-bold text-xs">
                    ✕ Close
                  </button>
                </div>

                {/* TAB SELECTOR: CREATE VS JOIN */}
                <div className="grid grid-cols-2 gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800 text-xs">
                  <button
                    type="button"
                    onClick={() => setOnboardingTab('CREATE')}
                    className={`py-2 rounded-lg font-bold transition-all ${
                      onboardingTab === 'CREATE' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    ➕ Create New Club
                  </button>
                  <button
                    type="button"
                    onClick={() => setOnboardingTab('JOIN')}
                    className={`py-2 rounded-lg font-bold transition-all ${
                      onboardingTab === 'JOIN' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    🔑 Join Existing Club
                  </button>
                </div>

                {/* FORM A: CREATE NEW CLUB */}
                {onboardingTab === 'CREATE' ? (
                  <form onSubmit={handleCreateClub} className="space-y-3 pt-1">
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Club Name</label>
                      <input
                        type="text"
                        value={newClubName}
                        onChange={(e) => setNewClubName(e.target.value)}
                        placeholder="e.g. Geelong Cricket Club"
                        required
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-semibold"
                      />
                    </div>

                    <div>
                      <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Club Short Code / Identifier</label>
                      <input
                        type="text"
                        value={newClubCode}
                        onChange={(e) => setNewClubCode(e.target.value)}
                        placeholder="e.g. GCC or MCC"
                        required
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-mono uppercase font-bold"
                      />
                    </div>

                    <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-[11px] text-slate-400 leading-relaxed">
                      💡 Creating a new club will make you the <strong>Head Coach / Club Admin</strong>. You'll be able to invite players using your Club Code and manage multi-zone net plans!
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs py-3 rounded-xl transition-all shadow mt-2"
                    >
                      Create Club & Open Workspace ✓
                    </button>
                  </form>
                ) : (
                  /* FORM B: JOIN EXISTING CLUB */
                  <form onSubmit={handleJoinClub} className="space-y-3 pt-1">
                    <div>
                      <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Enter Club Invite Code</label>
                      <input
                        type="text"
                        value={joinClubCode}
                        onChange={(e) => setJoinClubCode(e.target.value)}
                        placeholder="e.g. MCC or ODCC"
                        required
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 font-mono uppercase font-bold text-center tracking-widest text-emerald-400 text-sm"
                      />
                    </div>

                    <div>
                      <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Your Primary Role in Club</label>
                      <select
                        value={joinRole}
                        onChange={(e) => setJoinRole(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"
                      >
                        <option value="Player">Player</option>
                        <option value="Head Coach">Head Coach</option>
                        <option value="Assistant Bowling Coach">Assistant Bowling Coach</option>
                        <option value="Batting Coach">Batting Coach</option>
                        <option value="S&C Coach">S&C Coach / Physio</option>
                      </select>
                    </div>

                    <button
                      type="submit"
                      className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs py-3 rounded-xl transition-all shadow mt-2"
                    >
                      Join Club Workspace ✓
                    </button>
                  </form>
                )}

              </div>
            </div>
          )}

          {/* MODAL 4: WORKLOAD VERIFICATION */}
          {completionTarget && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-extrabold text-base text-white">
                    ✓ Verify & Log Workload
                  </h3>
                  <button onClick={() => setCompletionTarget(null)} className="text-slate-400 hover:text-white font-bold text-xs">
                    ✕ Cancel
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span className="text-[10px] text-slate-400 uppercase font-bold block">Completed Session</span>
                    <span className="font-bold text-white text-sm">{completionTarget.title}</span>
                  </div>

                  <div>
                    <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Actual Deliveries Bowled</label>
                    <input
                      type="number"
                      value={actualBalls}
                      onChange={(e) => setActualBalls(Number(e.target.value))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Perceived Exertion (RPE 1-10)</label>
                    <input
                      type="number"
                      min="1"
                      max="10"
                      value={actualRPE}
                      onChange={(e) => setActualRPE(Number(e.target.value))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div>
                    <label className="text-[10px] text-slate-400 font-bold uppercase block mb-1">Post-Session Soreness (1-10)</label>
                    <input
                      type="number"
                      min="1"
                      max="10"
                      value={actualSoreness}
                      onChange={(e) => setActualSoreness(Number(e.target.value))}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <button
                    onClick={() => {
                      const newLog = {
                        id: `l-${Date.now()}`,
                        userId: currentHuman.uid,
                        clubId: activeClubId,
                        scope: isPersonalWorkspace ? 'PERSONAL' : 'CLUB',
                        date: '2026-07-28',
                        balls: Number(actualBalls),
                        rpe: Number(actualRPE),
                        soreness: Number(actualSoreness),
                        type: 'Verified Session',
                        notes: `Completed "${completionTarget.title}"`
                      };
                      setGlobalLogs(prev => [newLog, ...prev]);
                      setCompletionTarget(null);
                      triggerNotify(`Logged ${actualBalls} deliveries into ACWR engine! ✓`, "success");
                    }}
                    className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs py-3 rounded-xl transition-all shadow mt-2"
                  >
                    Confirm & Update ACWR Engine ✓
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
